<style>
  :root{
    --navy:        #0b1c30;
    --navy-deep:   #071320;
    --navy-raised: #12283f;
    --navy-line:   rgba(196,163,101,0.18);
    --gold:        #c1892c;
    --gold-soft:   #e3b563;
    --gold-dim:    rgba(193,137,44,0.35);
    --ink-100:     #ffffff;
    --ink-70:      #c7d0dc;
    --ink-45:      #7f8ea3;
    --radius-lg:   22px;
    --radius-sm:   14px;
    --ease:        cubic-bezier(.22,.61,.36,1);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    background: var(--navy-deep);
    color: var(--ink-100);
    font-family:'Manrope', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
   min-height:auto;
  }

  img{ max-width:100%; display:block; }

  a{ color:inherit; text-decoration:none; }

  ::selection{ background:var(--gold); color:var(--navy-deep); }

  /* focus visibility */
  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--gold-soft);
    outline-offset: 4px;
    border-radius: 10px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }

  /* ============ BACKGROUND ============ */
  .scene{
    position:fixed;
    inset:0;
    z-index:-2;
    overflow:hidden;
  }
  .scene__img{
    position:absolute;
    inset:-4% -4% -4% -4%;
    width:108%;
    height:108%;
    object-fit:cover;
    object-position: center 30%;
    filter: saturate(0.92) brightness(0.62);
    animation: driftScene 42s ease-in-out infinite alternate;
  }
  @keyframes driftScene{
    0%   { transform: scale(1.06) translate3d(0,0,0); }
    100% { transform: scale(1.14) translate3d(-1%,-1%,0); }
  }
  .scene__overlay{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 70% at 50% 0%, rgba(11,28,48,0.15) 0%, rgba(11,28,48,0.78) 46%, var(--navy-deep) 88%),
      linear-gradient(180deg, rgba(7,19,32,0.55) 0%, rgba(7,19,32,0.2) 22%, rgba(7,19,32,0.85) 78%, var(--navy-deep) 100%);
  }
  .scene__vignette{
    position:absolute; inset:0;
    box-shadow: inset 0 0 22vw 4vw rgba(4,11,20,0.55);
    pointer-events:none;
  }

  /* ============ LAYOUT SHELL ============ */
.wrap{
  position:relative;
  z-index:1;
  max-width:640px;
  margin:-170px auto 0;
  padding:44px 20px 20px;
  min-height:calc(100vh + 170px);
  display:flex;
  flex-direction:column;
}

  /* ============ TOP / IDENTITY ============ */
 .identity{
  text-align:center;
  padding-top: 0;
  transform: translateY(-40px);
}

  .identity__logo{
    width: min(500px, 80vw);
    margin: 0 auto;
    opacity:0;
    animation: riseIn .9s var(--ease) .1s forwards;
  }

.identity__name{
    margin-top: 5px;
    position: relative;
    top: 0;
    font-family:'Syne', sans-serif;
    font-weight:500;
    font-size: clamp(24px, 3vw, 34px);
    letter-spacing: 0;
    color: var(--ink-100);
    opacity:0;
    transform: translateY(-20px);
    animation: riseIn .9s var(--ease) .22s forwards;
}
  .identity__tagline{
    margin-top: 8px;
    font-size: clamp(12.5px, 3.2vw, 14px);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold-soft);
    font-weight:600;
    opacity:0;
    animation: riseIn .9s var(--ease) .32s forwards;
  }

  .identity__rule{
    width: 46px;
    height: 2px;
    margin: 18px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  display: none;
    animation: riseIn .9s var(--ease) .4s forwards;
  }

  @keyframes riseIn{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  /* ============ CONTACT ICONS ============ */
  .contact-row{
    display:flex;
    justify-content:center;
    gap: 30px;
    margin-top: -135px;
    opacity:0;
    animation: riseIn .9s var(--ease) .5s forwards;
  }

  .contact-btn{
    position:relative;
    width: 54px;
    height: 54px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(227,181,99,0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform .35s var(--ease), background .35s var(--ease), border-color .35s var(--ease), box-shadow .35s var(--ease);
  }
  .contact-btn svg{
    width:22px; height:22px;
    stroke: var(--ink-100);
    transition: stroke .3s var(--ease), transform .45s var(--ease);
  }
  .contact-btn:hover,
  .contact-btn:focus-visible{
    transform: translateY(-4px);
    background: rgba(193,137,44,0.16);
    border-color: var(--gold);
    box-shadow: 0 10px 26px rgba(193,137,44,0.22);
  }
  .contact-btn:hover svg{ stroke:var(--gold-soft); transform:scale(1.08); }
  .contact-btn__label{
    position:absolute;
    bottom:-22px;
    left:50%;
    transform:translateX(-50%);
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color: var(--ink-45);
    white-space:nowrap;
  }

  /* ============ LINK BUTTONS ============ */
  .links{
    margin-top: 20px;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }

  .linkcard{
    --delay: 0s;
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    width:100%;
    padding: 16px 18px;
    border-radius: var(--radius-lg);
    background: linear-gradient(155deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
    border: 1px solid rgba(227,181,99,0.16);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow:hidden;
    cursor:pointer;
    opacity:0;
    animation: riseIn .8s var(--ease) forwards;
    animation-delay: var(--delay);
    transition: transform .4s var(--ease), border-color .4s var(--ease), background .4s var(--ease), box-shadow .4s var(--ease);
  }

  .linkcard::before{
    content:"";
    position:absolute;
    inset:0;
    background: linear-gradient(115deg, transparent 40%, rgba(227,181,99,0.10) 50%, transparent 60%);
    transform: translateX(-120%);
    transition: transform .7s var(--ease);
    pointer-events:none;
  }

  .linkcard:hover,
  .linkcard:focus-visible{
    transform: translateY(-3px) scale(1.008);
    border-color: rgba(227,181,99,0.55);
    background: linear-gradient(155deg, rgba(193,137,44,0.14), rgba(255,255,255,0.03));
    box-shadow: 0 16px 34px rgba(4,10,18,0.45), 0 0 0 1px rgba(227,181,99,0.08);
  }
  .linkcard:hover::before{ transform: translateX(120%); }

  .linkcard:active{ transform: translateY(-1px) scale(0.995); }

  .linkcard__icon{
    flex:none;
    width: 48px;
    height:48px;
    border-radius: 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(193,137,44,0.12);
    border:1px solid rgba(227,181,99,0.3);
    transition: background .4s var(--ease), transform .4s var(--ease), border-color .4s var(--ease);
  }
  .linkcard:hover .linkcard__icon{
    background: rgba(193,137,44,0.28);
    border-color: var(--gold);
    transform: rotate(-6deg) scale(1.05);
  }
  .linkcard__icon svg{
    width:23px; height:23px;
    stroke: var(--gold-soft);
    fill:none;
  }

  .linkcard__text{
    flex:1;
    min-width:0;
    text-align:left;
  }
  .linkcard__title{
    font-family:'Syne', sans-serif;
    font-weight:700;
    font-size: 16.5px;
    letter-spacing: 0.03em;
    color: var(--ink-100);
  }
  .linkcard__sub{
    margin-top:3px;
    font-size: 12.5px;
    color: var(--ink-45);
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .linkcard__end{
    flex:none;
    display:flex;
    align-items:center;
    gap:10px;
    color: var(--ink-45);
  }
  .linkcard__dots{
    width:18px; height:18px;
    stroke: var(--ink-45);
    opacity:.8;
  }
  .linkcard__arrow{
    width:16px; height:16px;
    stroke: var(--gold-soft);
    transition: transform .4s var(--ease);
  }
  .linkcard:hover .linkcard__arrow{ transform: translateX(4px); }

  /* ============ FOOTER ============ */
  .footer{
    margin-top: 0px;
    padding-top: 22px;
    text-align: center;
    border-top: none;
}
  .footer__mark{
    width:26px;
    margin:0 auto 10px;
   display:none;
  }
  .footer p{
    font-size: 11.5px;
    letter-spacing:.05em;
    color: var(--ink-45);
    line-height:1.7;
  }
  .footer strong{ color: var(--ink-70); font-weight:600; }

  /* ============ RESPONSIVE ============ */
  @media (min-width: 560px){
    .linkcard{ padding: 18px 22px; }
    .linkcard__title{ font-size:17.5px; }
  }

  @media (max-width: 360px){
    .contact-row{ gap:14px; }
    .contact-btn{ width:50px; height:50px; }
    .linkcard{ gap:12px; padding:14px 14px; }
    .linkcard__icon{ width:42px; height:42px; }
  }
body {
  transform: none;
}
.footer strong{
  color: var(--ink-70);
  font-weight:600;
}
